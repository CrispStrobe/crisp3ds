name: quality harness contracts

on:
  push:
    paths:
      - '.github/workflows/quality-harness.yml'
      - 'scripts/object_dataset/**'
      - 'scripts/object_motion/**'
      - 'scripts/classical_backend/**'
      - 'scripts/mve_full/**'
  pull_request:
    paths:
      - '.github/workflows/quality-harness.yml'
      - 'scripts/object_dataset/**'
      - 'scripts/object_motion/**'
      - 'scripts/classical_backend/**'
      - 'scripts/mve_full/**'

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install numpy==1.26.4 Pillow==12.0.0
      - name: Prepare bounded workspace temp directory
        shell: bash
        run: mkdir -p .local-tools/tmp
      - name: Run pure-Python contract tests
        env:
          TMPDIR: ${{ github.workspace }}/.local-tools/tmp
          TEMP: ${{ github.workspace }}/.local-tools/tmp
          TMP: ${{ github.workspace }}/.local-tools/tmp
        shell: bash
        run: |
          python -m unittest discover -s scripts/object_dataset -p 'test_*.py'
          python -m unittest discover -s scripts/object_motion -p 'test_*.py'
          python -m unittest discover -s scripts/classical_backend -p 'test_*.py'
          python -m unittest discover -s scripts/mve_full -p 'test_*.py'
