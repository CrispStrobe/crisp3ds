name: dense native

# The Rust port of the dense pipeline (crates/dense): formatting, lints and unit tests.
# The tests need no GPU and no Python; reference values from SciPy are committed
# under tests/fixtures/dense-native.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dense-native.yml'
      - 'crates/dense/**'
      - 'tests/fixtures/dense-config-defaults.json'
      - 'tests/fixtures/dense-native/**'
  pull_request:
    paths:
      - '.github/workflows/dense-native.yml'
      - 'crates/dense/**'
      - 'tests/fixtures/dense-config-defaults.json'
      - 'tests/fixtures/dense-native/**'

permissions:
  contents: read

concurrency:
  group: dense-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/dense
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The hosted images ship rustup; make sure the stable toolchain has both components.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc --version && cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/dense/target
          key: dense-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dense/Cargo.lock') }}
          restore-keys: |
            dense-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Command line smoke
        run: |
          cargo run --locked --quiet -- --version
          cargo run --locked --quiet -- mesh --help
