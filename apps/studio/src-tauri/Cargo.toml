[package]
name = "crisp3ds-studio"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Crisp3DS Studio: watch a photo-to-STL reconstruction step by step"
authors = ["Crisp3DS contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crisp3ds_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The engine child process and the native pickers exist on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = { version = "2", optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The desktop app starts the engine as a child process. Mac App Store builds are sandboxed and
# cannot do that: build them with --no-default-features to get the client-only variant
# (the same as on phones: connect to an engine elsewhere, or play the demo).
default = ["local-engine"]
local-engine = ["dep:tauri-plugin-dialog", "dep:getrandom"]

[profile.release]
strip = true
lto = "thin"
