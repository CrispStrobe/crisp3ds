[package]
name = "crisp3ds-dense-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Browser bindings (WebAssembly + WebGPU) of the Crisp3DS dense pipeline"
publish = false

# Built for wasm32-unknown-unknown only; see build.sh. The native crate does not
# depend on anything here.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
console_error_panic_hook = "0.1"
crisp3ds-dense = { path = ".." }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 3
