[package]
name = "crisp3ds-dense"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native port of the Crisp3DS all-view dense pipeline (reference implementation: scripts/turntable_mesh)"
publish = false

[lib]
name = "crisp3ds_dense"
path = "src/lib.rs"

[[bin]]
name = "crisp3ds-dense"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
web-time = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl", "webgpu"] }

# Free disk space before a run; there is no file system to ask in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs4 = "1.1"
# Drives the async GPU paths on a thread that may block.
pollster = "1"

# ONNX Runtime for the native SAM mask provider (src/photos/sam/onnx.rs), only with the feature `sam-onnx`.
# The runtime is a shared library loaded at run time: nothing is downloaded or linked when this crate is built.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ort]
version = "=2.0.0-rc.13"
optional = true
default-features = false
features = ["std", "load-dynamic", "api-20", "coreml"]

# Signalling the process group of an external tool (src/photos/process.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The C interface of the run driver (src/capi.rs, include/crisp3ds_dense.h).
capi = []
# The `sam` mask provider's ONNX backend: `--masks sam --sam-model DIR --sam-runtime libonnxruntime`.
sam-onnx = ["dep:ort"]

[profile.release]
opt-level = 3
