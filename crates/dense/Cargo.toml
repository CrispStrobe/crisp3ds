[package]
name = "crisp3ds-dense"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native port of the Crisp3DS all-view dense pipeline (reference implementation: scripts/turntable_mesh)"
publish = false

[lib]
name = "crisp3ds_dense"
path = "src/lib.rs"

[[bin]]
name = "crisp3ds-dense"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crc32fast = "1"
miniz_oxide = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
